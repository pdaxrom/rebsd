# FT2232D channel A: ADBUS0=TCK, ADBUS1=TDI, ADBUS2=TDO,
# ADBUS3=TMS, ADBUS4=nTRST (Ci20 J58 pin 1).
interface ftdi
ftdi_vid_pid 0x0403 0x6010
ftdi_channel 0
ftdi_layout_init 0x0018 0x001b
ftdi_layout_signal nTRST -data 0x0010 -oe 0x0010

transport select jtag
adapter_khz 100
reset_config trst_only separate trst_push_pull

jtag newtap jz4780 cpu \
    -irlen 5 \
    -ircapture 0x1 \
    -irmask 0x1f \
    -expected-id 0x0000024f

target create jz4780.cpu mips_xburst \
    -endian little \
    -chain-position jz4780.cpu

# JZ4780 exposes both CPUs through a shared TAP and requires an explicit core
# selector before any EJTAG implementation-register access.  Select the boot
# CPU as part of OpenOCD's normal examine lifecycle so reset processing can
# re-examine the target after a TAP reset instead of operating on a deferred,
# deliberately unexamined target.
jz4780.cpu configure -event examine-start {
    irscan jz4780.cpu 0x14
    runtest 10
}

# Compare the two JZ4780 core-select paths without requesting a debug break.
# The ECR input acknowledges ROCC and keeps PrAcc/ProbEn/ProbTrap asserted;
# it does not set EjtagBrk.  Two reads show whether Update-DR actually stuck.
proc ci20_probe_core {selector label} {
    irscan jz4780.cpu $selector
    runtest 10

    irscan jz4780.cpu 0x03
    set imp [drscan jz4780.cpu 32 0x00000000 -endstate idle]

    irscan jz4780.cpu 0x0a
    set ecr0 [drscan jz4780.cpu 32 0x0004c000 -endstate idle]
    set ecr1 [drscan jz4780.cpu 32 0x0004c000 -endstate idle]
    echo "ci20 $label: impcode=$imp ecr-before=$ecr0 ecr-after=$ecr1"
}

proc ci20_core_probe {} {
    ci20_probe_core 0x14 core0
    ci20_probe_core 0x15 core1

    # Leave the running boot CPU selected.
    irscan jz4780.cpu 0x14
    runtest 10
}

# Verify that an ECR value shifted through FTDI reaches Update-DR.  ProbTrap
# has no effect while the CPU stays out of Debug Mode, so it is safe to clear
# momentarily.  The last scan restores PrAcc/ProbEn/ProbTrap.
proc ci20_ecr_update_probe {} {
    irscan jz4780.cpu 0x14
    runtest 10
    irscan jz4780.cpu 0x0a

    set before [drscan jz4780.cpu 32 0x00048000 -endstate idle]
    set cleared [drscan jz4780.cpu 32 0x0004c000 -endstate idle]
    set restored [drscan jz4780.cpu 32 0x0004c000 -endstate idle]
    echo "ci20 ECR update: before=$before cleared=$cleared restored=$restored"
}

# Stop briefly, capture the key execution registers, and always resume if the
# target reached the halted state.  The catch prevents a failed register read
# from skipping the resume path.
proc ci20_halt_snapshot {} {
    set rc [catch {
        # Observe and clear any reset occurrence before selecting a core.
        # The XBurst target's cached EJTAG control word never replays ROCC.
        poll

        # JZ4780 permits EJTAG access to one core at a time.  Re-select
        # CORE0 immediately before requesting the debug break.
        irscan jz4780.cpu 0x14
        halt
        wait_halt 2000
        poll
        reg pc
        reg r29
        reg r31
    } result]

    set stopped [string equal [jz4780.cpu curstate] "halted"]
    if {$stopped} {
        resume
        sleep 100
    }
    poll
    echo "ci20 halt snapshot: rc=$rc result=$result final=[jz4780.cpu curstate]"
}

# Reset the complete JZ4780 SoC through its watchdog.  EJTAG PRRST resets only
# the selected CPU core and therefore cannot return a running ReBSD kernel to
# the CI20 U-Boot prompt.  Keep this sequence identical to _machine_restart()
# in the official CI20 U-Boot: 48 MHz EXTAL, divide by four, 4 ms timeout.
proc ci20_soc_reset {} {
    poll
    irscan jz4780.cpu 0x14
    halt
    wait_halt 2000

    # WDT_TCSR = WDT_TCSR_PRESCALE4 | WDT_TCSR_EXT_EN.
    mwh 0xb000200c 0x000c
    # WDT_TCNT = 0; WDT_TDR = CONFIG_SYS_EXTAL / 1000.
    mwh 0xb0002008 0x0000
    mwh 0xb0002000 0xbb80
    # TCU_TSCR = TCU_TSSR_WDTSC, then WDT_TCER = WDT_TCER_TCEN.
    mww 0xb000203c 0x00010000
    mwb 0xb0002004 0x01

    echo "ci20: JZ4780 watchdog reset armed"
    sleep 100
}
